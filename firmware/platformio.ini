; SkyNoid V1 controller firmware (ESP32, ESP-IDF on PlatformIO).
; Run every pio command from this folder (firmware/).
;   pio run -e single                build for the board
;   pio run -e single -t upload      flash
;   pio device monitor               watch the boot line
;   pio test -e native               host tests of the pure-C libraries (no board needed)
;
; More envs (single_uart2, single_locked) arrive with step 1.3, when the console
; flags exist. Dual-node roles come later (see vault note repo-layout).

[platformio]
default_envs = single

[env:single]
; TODO step 1.1: after the first successful build, pin the platform version here
; (platform = espressif32@<version>) and record the IDF version in docs/measurements.md.
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags = -Isrc

[env:native]
; Compiles lib/ (pure C, no ESP-IDF) for the PC and runs test/ with Unity.
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra
