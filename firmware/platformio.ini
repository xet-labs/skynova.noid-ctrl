; SkyNoid V1 controller firmware (ESP32, ESP-IDF on PlatformIO).
; Run every pio command from this folder (firmware/).
;   pio run -e single                build for the board
;   pio run -e single -t upload      flash
;   pio device monitor               watch the boot line
;   pio test -e native               host tests of the pure-C libraries (no board needed)
;
; More envs (single_uart2, single_link2) set the link and console UARTs, see below and
; docs/steps/step-1.7-uart-channels.md. Dual-node roles come later (see vault note repo-layout).

[platformio]
default_envs = single

[env:single]
; TODO step 1.1: after the first successful build, pin the platform version here
; (platform = espressif32@<version>) and record the IDF version in docs/measurements.md.
platform = espressif32@7.1.2
board = esp32dev
framework = espidf
monitor_speed = 460800
build_flags = -Isrc

[env:single_bench]
; BENCH ONLY, wheels in the air. Same as `single`, but motion is allowed before the floor sensors are
; calibrated (-DSKYNOID_CLIFF_REQUIRED=0). With this build the cliff reflex still works once cal_floor has run,
; but a robot that has not calibrated would drive off a table. Never run it on the ground.
; Added 2026-10-25 by claude-code_c9a1. Build: pio run -e single_bench -t upload
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DSKYNOID_CLIFF_REQUIRED=0

[env:single_uart2]
; Step 1.7: console on its OWN UART2 (GPIO5 TX, GPIO15 RX, 115200); USB (UART0, 460800) carries frames only.
; Wire a 3.3 V USB-serial adapter: adapter RX to GPIO5, adapter TX to GPIO15, GND to GND. No DTR/RTS.
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DUART_CONSOLE_NUM=2

[env:single_link2]
; Step 1.7: frames on UART2 (GPIO5/15, 460800, for the Pi); USB (UART0) becomes a plain console at 115200.
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DUART_LINK_NUM=2
    -DUART_CONSOLE_NUM=0

[env:single_servo_trial]
; Step G: servo bench trial. Unlocks the `servo` console command (raw pulse width, every pulse expires on its own) and
; `servo test <ch>`, the D20 pulse test that tells continuous-rotation from positional servos. Same as `single`
; otherwise. Servo power rail ON, ONE servo on channel 0 first, horn or load removed. Never leave it running unattended.
; After the test, if the servos are POSITIONAL, add -DSKYNOID_SERVO_TYPE_CONFIRMED=1 to unlock `servo angle`.
; Build: pio run -e single_servo_trial -t upload   (run `pio run -t clean -e single_servo_trial` once: new source files)
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DSKYNOID_SERVO_TRIAL=1

[env:single_servo_angle]
; Step G, POSITIONAL servos only. Same as single_servo_trial plus `servo angle <ch> <deg> [ms]` (soft limits, minimum-jerk
; move, 90 deg/s speed limit, power budget). Flash it ONLY if `servo test 0` showed three different held angles.
; A continuous-rotation servo would keep spinning after an angle move, because the pulse is held until `servo off`.
; Needs `maint on` first. Build: pio run -e single_servo_angle -t upload
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DSKYNOID_SERVO_TRIAL=1
    -DSKYNOID_SERVO_TYPE_CONFIRMED=1

[env:single_batt_test]
; Bench test of the low-battery beep (R6) without draining the pack. Same as `single`, but the LOW threshold is raised
; to 12000 mV (SKYNOID_TEST_BATT_LOW_MV, see app_config.h). Pick the value from `batt`: it must sit a few hundred mV
; ABOVE the pack voltage now (11404 mV on 2026-10-26 gave 12000), within 9000..12600 mV, and the pack must stay
; below it for 5 s. Then expect three 120 ms beeps, repeated every 30 s, an EVT batt_low, and silence again once the
; pack reads above the threshold + 150 mV. The CRIT threshold keeps its default (10050 mV), so nothing latches.
; To test the critical alarm as well (motors and servos off, 1 s on / 1 s off until power cycle) add
; -DSKYNOID_TEST_BATT_CRIT_MV=<a value between 8500..12000 that is above the pack and below the LOW value>.
; Never leave a test build on a robot that is used. Build: pio run -e single_batt_test -t upload
extends = env:single
build_flags =
    ${env:single.build_flags}
    -DSKYNOID_TEST_BATT_LOW_MV=12000

[env:native]
; Compiles lib/ (pure C, no ESP-IDF) for the PC and runs test/ with Unity.
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra
